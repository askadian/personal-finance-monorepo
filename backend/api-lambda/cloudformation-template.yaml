AWSTemplateFormatVersion: '2010-09-09'
Description: 'Personal Finance API - Lambda Function and API Gateway'

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Environment name
  
  DynamoDBTableName:
    Type: String
    Default: personal-finance-data
    Description: Name of the DynamoDB table for storing financial data

Resources:
  # IAM Role for Lambda Execution
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'PersonalFinanceAPILambdaRole-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:BatchGetItem
                Resource:
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DynamoDBTableName}'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DynamoDBTableName}/index/*'
        - PolicyName: S3ReadAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !Sub 'arn:aws:s3:::personal-finance-${Environment}-*'
                  - !Sub 'arn:aws:s3:::personal-finance-${Environment}-*/*'

  # Lambda Function
  PersonalFinanceAPILambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'personal-finance-api-${Environment}'
      Description: REST API handler for Personal Finance application
      Runtime: python3.12
      Handler: lambda_function.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          DYNAMODB_TABLE_NAME: !Ref DynamoDBTableName
          LOG_LEVEL: INFO
      Code:
        ZipFile: |
          # Placeholder code - will be replaced by GitHub Actions deployment
          def lambda_handler(event, context):
              return {
                  'statusCode': 200,
                  'body': '{"message": "Placeholder - update via deployment"}'
              }
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: PersonalFinance

  # CloudWatch Log Group for Lambda
  LambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/personal-finance-api-${Environment}'
      RetentionInDays: 7

  # Lambda Permission for API Gateway
  LambdaApiGatewayPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref PersonalFinanceAPILambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${PersonalFinanceAPI}/*'

  # REST API Gateway
  PersonalFinanceAPI:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub 'personal-finance-api-${Environment}'
      Description: REST API for Personal Finance application
      EndpointConfiguration:
        Types:
          - REGIONAL
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # API Gateway Authorizer (Cognito - optional, can be added later)
  # CognitoAuthorizer:
  #   Type: AWS::ApiGateway::Authorizer
  #   Properties:
  #     Name: CognitoAuthorizer
  #     Type: COGNITO_USER_POOLS
  #     IdentitySource: method.request.header.Authorization
  #     RestApiId: !Ref PersonalFinanceAPI
  #     ProviderARNs:
  #       - !Sub 'arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}'

  # API Gateway Resources and Methods
  # Proxy resource to handle all paths
  ProxyResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref PersonalFinanceAPI
      ParentId: !GetAtt PersonalFinanceAPI.RootResourceId
      PathPart: '{proxy+}'

  # Proxy method for all HTTP methods
  ProxyMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref PersonalFinanceAPI
      ResourceId: !Ref ProxyResource
      HttpMethod: ANY
      AuthorizationType: NONE  # Change to COGNITO_USER_POOLS when ready
      # AuthorizerId: !Ref CognitoAuthorizer  # Uncomment when Cognito is configured
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PersonalFinanceAPILambda.Arn}/invocations'
        IntegrationResponses:
          - StatusCode: 200

  # Root method for base path
  RootMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref PersonalFinanceAPI
      ResourceId: !GetAtt PersonalFinanceAPI.RootResourceId
      HttpMethod: ANY
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PersonalFinanceAPILambda.Arn}/invocations'

  # API Gateway Deployment
  APIDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - ProxyMethod
      - RootMethod
    Properties:
      RestApiId: !Ref PersonalFinanceAPI
      Description: !Sub 'Deployment for ${Environment} environment'

  # API Gateway Stage
  APIStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref PersonalFinanceAPI
      DeploymentId: !Ref APIDeployment
      StageName: !Ref Environment
      Description: !Sub '${Environment} stage'
      TracingEnabled: true
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          LoggingLevel: INFO
          DataTraceEnabled: true
          MetricsEnabled: true

  # CloudWatch Log Group for API Gateway
  APILogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/apigateway/personal-finance-api-${Environment}'
      RetentionInDays: 7

Outputs:
  LambdaFunctionArn:
    Description: ARN of the Lambda function
    Value: !GetAtt PersonalFinanceAPILambda.Arn
    Export:
      Name: !Sub '${AWS::StackName}-LambdaArn'

  LambdaFunctionName:
    Description: Name of the Lambda function
    Value: !Ref PersonalFinanceAPILambda
    Export:
      Name: !Sub '${AWS::StackName}-LambdaName'

  APIGatewayId:
    Description: ID of the API Gateway
    Value: !Ref PersonalFinanceAPI
    Export:
      Name: !Sub '${AWS::StackName}-APIGatewayId'

  APIGatewayURL:
    Description: URL of the API Gateway
    Value: !Sub 'https://${PersonalFinanceAPI}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
    Export:
      Name: !Sub '${AWS::StackName}-APIGatewayURL'

  LambdaExecutionRoleArn:
    Description: ARN of the Lambda execution role
    Value: !GetAtt LambdaExecutionRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-LambdaRoleArn'
