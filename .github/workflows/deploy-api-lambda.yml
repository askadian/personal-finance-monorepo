name: Deploy Personal Finance API Lambda

on:
  push:
    branches:
      - main
    paths:
      - 'backend/api-lambda/**'
      - '.github/workflows/deploy-api-lambda.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/api-lambda/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  AWS_REGION: us-east-1
  PYTHON_VERSION: '3.12'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        working-directory: backend/api-lambda
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run tests
        working-directory: backend/api-lambda
        run: |
          pytest tests/ -v --cov=lambda_function --cov-report=term-missing
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: github.event_name == 'pull_request'
        with:
          files: ./backend/api-lambda/.coverage
          flags: lambda-tests
          fail_ci_if_error: false

  validate-cloudformation:
    name: Validate CloudFormation Template
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        if: github.event_name != 'pull_request'
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Validate CloudFormation template
        if: github.event_name != 'pull_request'
        working-directory: backend/api-lambda
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation-template.yaml

  build:
    name: Build Lambda Package
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Create deployment package
        working-directory: backend/api-lambda
        run: |
          # Create a clean directory for the package
          mkdir -p package
          
          # Install production dependencies only (exclude test dependencies)
          pip install boto3 -t package/
          
          # Copy Lambda function
          cp lambda_function.py package/
          
          # Create ZIP file
          cd package
          zip -r ../lambda-deployment-package.zip .
          cd ..
      
      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: lambda-deployment-package
          path: backend/api-lambda/lambda-deployment-package.zip
          retention-days: 5

  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: [test, validate-cloudformation, build]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment:
      name: ${{ github.event.inputs.environment || 'dev' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: lambda-deployment-package
          path: backend/api-lambda/
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Set environment
        id: set-env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "ENVIRONMENT=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          else
            echo "ENVIRONMENT=dev" >> $GITHUB_OUTPUT
          fi
      
      - name: Deploy CloudFormation Stack
        working-directory: backend/api-lambda
        run: |
          STACK_NAME="personal-finance-api-${{ steps.set-env.outputs.ENVIRONMENT }}"
          
          # Check if stack exists
          if aws cloudformation describe-stacks --stack-name $STACK_NAME 2>/dev/null; then
            echo "Updating existing stack..."
            aws cloudformation update-stack \
              --stack-name $STACK_NAME \
              --template-body file://cloudformation-template.yaml \
              --parameters ParameterKey=Environment,ParameterValue=${{ steps.set-env.outputs.ENVIRONMENT }} \
              --capabilities CAPABILITY_NAMED_IAM \
              --tags Key=ManagedBy,Value=GitHub-Actions Key=Repository,Value=${{ github.repository }}
            
            aws cloudformation wait stack-update-complete --stack-name $STACK_NAME
          else
            echo "Creating new stack..."
            aws cloudformation create-stack \
              --stack-name $STACK_NAME \
              --template-body file://cloudformation-template.yaml \
              --parameters ParameterKey=Environment,ParameterValue=${{ steps.set-env.outputs.ENVIRONMENT }} \
              --capabilities CAPABILITY_NAMED_IAM \
              --tags Key=ManagedBy,Value=GitHub-Actions Key=Repository,Value=${{ github.repository }}
            
            aws cloudformation wait stack-create-complete --stack-name $STACK_NAME
          fi
      
      - name: Update Lambda Function Code
        working-directory: backend/api-lambda
        run: |
          FUNCTION_NAME="personal-finance-api-${{ steps.set-env.outputs.ENVIRONMENT }}"
          
          aws lambda update-function-code \
            --function-name $FUNCTION_NAME \
            --zip-file fileb://lambda-deployment-package.zip
          
          # Wait for the update to complete
          aws lambda wait function-updated --function-name $FUNCTION_NAME
      
      - name: Get API Gateway URL
        id: get-url
        run: |
          STACK_NAME="personal-finance-api-${{ steps.set-env.outputs.ENVIRONMENT }}"
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name $STACK_NAME \
            --query 'Stacks[0].Outputs[?OutputKey==`APIGatewayURL`].OutputValue' \
            --output text)
          echo "API_URL=$API_URL" >> $GITHUB_OUTPUT
          echo "API Gateway URL: $API_URL"
      
      - name: Test deployment
        run: |
          # Wait a few seconds for API Gateway to be ready
          sleep 10
          
          # Test the API endpoint
          API_URL="${{ steps.get-url.outputs.API_URL }}"
          
          echo "Testing $API_URL/transactions"
          curl -X GET "$API_URL/transactions" \
            -H "X-User-Id: test_user" \
            -H "Content-Type: application/json" \
            || echo "Warning: API test failed, but deployment may still be successful"
      
      - name: Comment PR with deployment info
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Lambda function deployed successfully!\n\n**API Gateway URL:** ${{ steps.get-url.outputs.API_URL }}'
            })

  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    
    steps:
      - name: Job Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ github.event.inputs.environment || 'dev' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Region:** ${{ env.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ needs.deploy.result }}" >> $GITHUB_STEP_SUMMARY
